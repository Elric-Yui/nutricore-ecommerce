<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mon Panier — NutriCore</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────── -->
<header class="header">
  <div class="container">
    <div class="header-inner">
      <a href="index.html" class="logo">Nutri<span>Core</span></a>
      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="index.html#produits">Produits</a>
        <a href="index.html#avis">Avis</a>
        <a href="#">Notre histoire</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="btn-cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-label">Panier</span>
          <span class="cart-count" id="cart-count">0</span>
        </a>
        <button class="burger" id="burger">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
    <nav class="mobile-nav" id="mobile-nav">
      <a href="index.html">Accueil</a>
      <a href="index.html#produits">Produits</a>
      <a href="index.html#avis">Avis</a>
    </nav>
  </div>
</header>

<!-- ── CART PAGE ──────────────────────────────────────────────── -->
<div class="cart-page page container">
  <h1>Mon Panier</h1>

  <div id="cart-layout" class="cart-layout">
    <div id="cart-items-col">
      <!-- Items filled by JS -->
    </div>
    <div id="cart-summary-col">
      <!-- Summary filled by JS -->
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  // ── Render cart ─────────────────────────────────────────────
  function renderCart() {
    const items    = Cart.getItems();
    const itemsCol = document.getElementById('cart-items-col');
    const summaryCol = document.getElementById('cart-summary-col');

    if (items.length === 0) {
      document.getElementById('cart-layout').style.display = 'block';
      itemsCol.innerHTML = `
        <div class="cart-empty">
          <div class="icon">🛒</div>
          <h3>Votre panier est vide</h3>
          <p>Découvrez nos produits et commencez votre transformation.</p>
          <a href="index.html#produits" class="btn-primary">Voir les produits</a>
        </div>`;
      summaryCol.innerHTML = '';
      return;
    }

    document.getElementById('cart-layout').style.display = '';

    // Subtotals
    const subtotal     = items.reduce((s, i) => s + i.unitPrice * i.qty, 0);
    const savings      = items.reduce((s, i) => {
      const original = i.isSubscription ? +(i.unitPrice / 0.85) * i.qty : 0;
      return s + (original > 0 ? original - i.unitPrice * i.qty : 0);
    }, 0);
    const shipping     = subtotal >= 60 ? 0 : 4.90;
    const total        = subtotal + shipping;
    const hasSubItems  = items.some(i => i.isSubscription);

    // Items
    itemsCol.innerHTML = `<div class="cart-items">
      ${items.map(item => `
        <div class="cart-item" id="ci-${item.id}">
          <div class="cart-item-img">${(() => {
            const prod = NUTRICORE_DATA.products.find(p => p.id === item.productId);
            return prod && prod.imageUrl
              ? `<img src="${prod.imageUrl}" alt="${item.name}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;display:block;"/>`
              : item.icon;
          })()}</div>
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-variant">${item.variantLabel}</div>
            ${item.isSubscription
              ? `<div class="cart-item-sub">🔄 Abonnement mensuel — -15%</div>`
              : `<div class="cart-item-sub" style="color:var(--muted)">Achat unique</div>`}
          </div>
          <div class="cart-item-actions">
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
              <span class="qty-val">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
            </div>
            <div class="cart-item-price">${fmtPrice(item.unitPrice * item.qty)}</div>
            <button class="cart-remove" onclick="removeItem('${item.id}')" title="Supprimer">✕</button>
          </div>
        </div>`).join('')}
    </div>`;

    // Summary
    summaryCol.innerHTML = `
      <div class="cart-summary">
        <div class="summary-title">Récapitulatif</div>

        <div class="summary-row">
          <span class="label">Sous-total (${items.reduce((s,i)=>s+i.qty,0)} articles)</span>
          <span class="val">${fmtPrice(subtotal)}</span>
        </div>

        ${savings > 0 ? `
        <div class="summary-row">
          <span class="label">Économies abonnement</span>
          <span class="val green">−${fmtPrice(savings)}</span>
        </div>` : ''}

        <div class="summary-row">
          <span class="label">Livraison</span>
          <span class="val ${shipping === 0 ? 'green' : ''}">${shipping === 0 ? 'Gratuite ✓' : fmtPrice(shipping)}</span>
        </div>

        ${shipping > 0 ? `
        <div style="font-size:.78rem;color:var(--muted);margin-top:-6px;margin-bottom:12px">
          Plus que ${fmtPrice(60 - subtotal)} pour la livraison gratuite
          <div style="height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden">
            <div style="height:100%;width:${Math.min(100,(subtotal/60)*100).toFixed(0)}%;background:var(--green);border-radius:2px;transition:width .4s"></div>
          </div>
        </div>` : ''}

        <div class="summary-divider"></div>

        <div class="summary-total">
          <span>Total</span>
          <span>${fmtPrice(total)}</span>
        </div>

        <button class="btn-checkout" onclick="handleCheckout()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Procéder au paiement
        </button>

        <a href="index.html#produits" class="btn-continue">← Continuer mes achats</a>

        <div class="coupon-row">
          <input type="text" class="coupon-input" id="coupon-input" placeholder="Code promo"/>
          <button class="btn-coupon" onclick="applyCoupon()">Appliquer</button>
        </div>

        <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
          <div style="display:flex;gap:12px;justify-content:center;font-size:.78rem;color:var(--muted)">
            <span>🔒 SSL sécurisé</span>
            <span>💳 CB / PayPal</span>
            <span>🚚 Colissimo</span>
          </div>
        </div>
      </div>`;

    updateCartBadge();
  }

  // ── Actions ─────────────────────────────────────────────────
  function changeQty(itemId, delta) {
    Cart.updateQty(itemId, delta);
    renderCart();
  }

  function removeItem(itemId) {
    Cart.removeItem(itemId);
    renderCart();
    showToast('🗑️', 'Article retiré du panier', '');
  }

  function handleCheckout() {
    showToast('✅', 'Commande en cours...', 'Vous serez redirigé vers le paiement sécurisé.');
    // Stripe integration point
    setTimeout(() => {
      alert('💳 Intégration Stripe à connecter.\nConfigurez STRIPE_SECRET_KEY dans .env.local');
    }, 1000);
  }

  function applyCoupon() {
    const code = document.getElementById('coupon-input')?.value.trim().toUpperCase();
    if (!code) return;
    const valid = { 'NUTRI10': 10, 'WELCOME15': 15 };
    if (valid[code]) {
      showToast('🎉', `Code "${code}" appliqué !`, `-${valid[code]}% sur votre commande`);
    } else {
      showToast('❌', 'Code invalide', 'Vérifiez votre code promo');
    }
  }

  // ── Init ─────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
